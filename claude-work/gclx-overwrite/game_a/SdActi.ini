[SdActi]
# 相対パス形式なども可能。
# 空白を含むパス名の場合は引用符が必要
AppPath=".\GUILTY CROWN LOST XMAS.exe"

# 引用符と二重引用符を使い分けること
AppArg=""

# %title%を置換する文字列
AppTitle="ギルティクラウン ロストクリスマス"

# アクティベーションが必要か否かを判定する電池
# Appの動作条件を書き換えることができるわけではない。
# 言い換えると、これを書き換えても、Appに起動条件は変化しないが
# SdActiの動作は変化する。
# ライセンスの開放は、ここに記述した電池IDが対象。
sdkid="{010017EC-D951-8ECA-9E9F-006052036AD8}"


# 起動時sdrtが検出されなかった場合に、インストールされる。
# 記述なき場合は、規定のweb画面が開かれる。
# いずれも確認つき。

#sdrt=sdrt4281j.exe
sdrt=sdrt4280j.exe
